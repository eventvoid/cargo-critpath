[workspace]
members = ["crates/critpath-core", "crates/cargo-critpath"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.74.0"
license = "MIT OR Apache-2.0"
repository = "https://github.com/cargo-critpath/cargo-critpath"
categories = ["development-tools::cargo-plugins", "development-tools::profiling"]
keywords = ["cargo", "build-time", "critical-path", "scheduling"]

[workspace.dependencies]
critpath-core = { version = "0.1.0", path = "crates/critpath-core" }
serde_json = "1.0.108"
lexopt = "0.3.0"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
integer_division = "warn"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"

[profile.release]
overflow-checks = true
